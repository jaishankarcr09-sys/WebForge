services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webforge
      POSTGRES_USER: webforge
      POSTGRES_PASSWORD: webforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
